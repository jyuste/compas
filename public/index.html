<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compás · Planificador de jornada</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body><div id="app"><p class="loading">Cargando tu planificación…</p></div><div id="toast" role="status" aria-live="polite"></div><dialog id="period-dialog"><form id="period-form"><div class="dialog-head"><div><p class="eyebrow">PLANIFICACIÓN</p><h2 id="dialog-title">Nuevo periodo</h2></div><button type="button" class="ghost" id="close-dialog" aria-label="Cerrar">✕</button></div><input type="hidden" name="id"><label>Nombre<input name="name" maxlength="100" placeholder="Ej. Jornada intensiva de verano" required></label><div class="two"><label>Desde<input type="date" name="from" required></label><label>Hasta<input type="date" name="to" required></label></div><label>Tipo<select name="kind"><option value="off">Sin actividad · vacaciones o festivo</option><option value="schedule">Horario especial · intensiva o excepción</option></select></label><div id="special-days"></div><p class="muted">Una excepción de un solo día tiene prioridad sobre un periodo. Las vacaciones y los festivos tienen prioridad sobre cualquier horario.</p><div class="dialog-actions"><button type="button" class="secondary" id="cancel-dialog">Cancelar</button><button type="submit">Guardar periodo</button></div><p id="form-error" role="alert"></p></form></dialog></body></html>
